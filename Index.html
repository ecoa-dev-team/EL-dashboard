<script>
    // --- GLOBAL VARIABLES & CONFIG ---
    let appData = [], recData = [], pnlData = [], salesData = [];
    let tableFilters = {};
    let selectedDeptGroup = "ALL";
    let currentGranularity = 'monthly';
    let ccSortOrder = 'desc', itemSortOrder = 'desc', amountSortOrder = 'desc';
    let ccCurrentPage = 1, itemCurrentPage = 1;
    const ITEMS_PER_PAGE = 10;
    let selectedCCForDrivers = null;
    let ccDataFull = [], itemDataFull = [];
    let mixChart, ageChart, trendChart, weeklyPnlChart, companyDistChart, unitCostCompChart;
    const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const ENTITY_TO_SALES_COUNTRY_MAP = { "BURN Manufacturing": "Kenya", "BURN Somalia": "Somalia", "BURN DRC": "DRC" }; // Expand as needed

    // --- BLOCK 1: UTILS & CORE NAVIGATION ---
    const cleanNum = (v) => { if (v === null || v === undefined || v === "") return 0; if (typeof v === 'number') return v; return parseFloat(v.toString().replace(/[^\d.-]/g, '')) || 0; };
    const getCol = (row, ...keys) => { const found = Object.keys(row).find(k => keys.some(s => k.toLowerCase().trim() === s.toLowerCase().trim())); return found ? row[found] : null; };
    
    const parseExcelDate = (val) => { 
        if (!val) return null; 
        if (val instanceof Date) return new Date(val.setHours(0,0,0,0)); 
        let s = val.toString().trim(); 
        const gDateMatch = s.match(/Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?\)/); 
        if (gDateMatch) { const [_, y, m, d] = gDateMatch; return new Date(y, m, d, 0, 0, 0, 0); } 
        const dotMatch = s.split('.'); if (dotMatch.length === 3) { return new Date(dotMatch[2], dotMatch[1] - 1, dotMatch[0], 0, 0, 0, 0); } 
        const iso = new Date(s); if(!isNaN(iso.getTime())) { return new Date(iso.getFullYear(), iso.getMonth(), iso.getDate(), 0, 0, 0, 0); } 
        return null; 
    };

    const formatDateStr = (d) => { if (!d || isNaN(d.getTime())) return '-'; return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`; };
    const getWeekNumber = (d) => { d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7)); var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1)); return Math.ceil(( ( (d - yearStart) / 86400000) + 1)/7); };
    const getQuarter = (d) => { return 'Q' + Math.floor((d.getMonth() + 3) / 3); };

    function cycleDeptGroup() {
        const el = document.getElementById('deptGroupTriToggle');
        const state = el.getAttribute('data-state');
        let newState, label;
        if (state === "SD") { newState = "GA"; label = "General & Admin"; }
        else if (state === "GA") { newState = "ALL"; label = "ALL"; }
        else { newState = "SD"; label = "Selling & Distribution"; }
        el.setAttribute('data-state', newState);
        selectedDeptGroup = label;
        document.getElementById('activeDeptText').innerText = label;
        updateDashboard();
    }

    function switchTab(id, btn) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        const target = document.getElementById(id);
        if (target) target.classList.add('active'); 
        if (btn) btn.classList.add('active');
        const isCost = (id === 'cost-analysis');
        const isDash = (id === 'dashboard');
        const isApp = (id === 'approvals-tab');
        if (document.getElementById('global-filters')) document.getElementById('global-filters').style.display = isApp ? 'none' : 'flex';
        if (document.getElementById('dept-toggle-container')) document.getElementById('dept-toggle-container').style.display = isCost ? 'block' : 'none';
        if (document.getElementById('fDeptGroupWrapper')) document.getElementById('fDeptGroupWrapper').style.display = isDash ? 'flex' : 'none';
        updateDashboard();
    }

    function syncGranularity(type) {
        currentGranularity = type;
        document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.btn-' + type).forEach(b => b.classList.add('active'));
        updateDashboard();
    }

    function changePage(type, direction) {
        if (type === 'cc') { ccCurrentPage += direction; renderCCDriversList(); } 
        else { itemCurrentPage += direction; renderItemDriversList(); }
    }

    function setDriverSort(listType, order) {
        if (listType === 'cc') {
            ccSortOrder = order;
            document.getElementById('ccSortDesc').classList.toggle('active', order === 'desc');
            document.getElementById('ccSortAsc').classList.toggle('active', order === 'asc');
            ccDataFull.sort((a,b) => order === 'desc' ? b[1] - a[1] : a[1] - b[1]);
            ccCurrentPage = 1;
            renderCCDriversList();
        } else {
            itemSortOrder = order;
            document.getElementById('itemSortDesc').classList.toggle('active', order === 'desc');
            document.getElementById('itemSortAsc').classList.toggle('active', order === 'asc');
            itemDataFull.sort((a,b) => order === 'desc' ? b[1] - a[1] : a[1] - b[1]);
            itemCurrentPage = 1;
            renderItemDriversList();
        }
    }

    // --- DRILL DOWN LOGIC ---
    function drillToLedgerByTrendPoint(pointSortKey) {
        tableFilters = {};
        const filters = getGlobalFiltersObj();
        const rawCols = Object.keys(appData[0] || {});
        const fileNameKey = rawCols.find(k => k.toLowerCase().includes('full file name'));
        const pendingFilesGlobal = recData.filter(r => (getCol(r, 'Status') || "").toLowerCase().includes('pending')).map(r => (getCol(r, 'PRF file') || "").toString().trim());

        const validCommittedFiles = appData.filter(row => {
            const rowDeptGroup = getCol(row, 'Department Group', 'Dept Group');
            if (selectedDeptGroup !== "ALL" && rowDeptGroup && rowDeptGroup !== selectedDeptGroup) return false;
            const d = parseExcelDate(getCol(row, 'Date Approved', 'Approval Date'));
            if (!d) return false;
            let rowSortKey = "";
            if (currentGranularity === 'weekly') rowSortKey = `${d.getFullYear()}-${getWeekNumber(d).toString().padStart(2, '0')}`;
            else if (currentGranularity === 'monthly') rowSortKey = `${d.getFullYear()}-${(d.getMonth() + 1).toString().padStart(2, '0')}`;
            else rowSortKey = `${d.getFullYear()}-${getQuarter(d)}`;
            if (rowSortKey !== pointSortKey) return false;
            if ((filters.start && d < filters.start) || (filters.end && d > filters.end)) return false;
            const type = (getCol(row, 'Document Type', 'Type') || "").toUpperCase();
            const fname = (getCol(row, 'Full File Name') || "").toString().trim();
            return (type.includes('ECF') || type.includes('TRF') || type.includes('INV')) || ((type.includes('PRF') || type.includes('PR')) && pendingFilesGlobal.includes(fname));
        }).map(r => (getCol(r, 'Full File Name') || "").toString().trim());

        if (fileNameKey) tableFilters[fileNameKey] = validCommittedFiles;
        syncGlobalSelectionsToLedger(filters);
        syncFilterIcons();
        switchTab('approvals-tab', document.getElementById('btn-approvals'));
        renderApprovalsTable(appData);
    }

    function drillToLedgerByKpi(mode) {
        tableFilters = {};
        const filters = getGlobalFiltersObj();
        const rawCols = Object.keys(appData[0] || {});
        const fileNameKey = rawCols.find(k => k.toLowerCase().includes('full file name'));
        const pendingFilesGlobal = recData.filter(r => (getCol(r, 'Status') || "").toLowerCase().includes('pending')).map(r => (getCol(r, 'PRF file') || "").toString().trim());
        const validFiles = appData.filter(row => {
            const rowDeptGroup = getCol(row, 'Department Group', 'Dept Group');
            if (selectedDeptGroup !== "ALL" && rowDeptGroup && rowDeptGroup !== selectedDeptGroup) return false;
            const d = parseExcelDate(getCol(row, 'Date Approved', 'Approval Date'));
            if ((filters.start && d < filters.start) || (filters.end && d > filters.end)) return false;
            if (filters.yr && !filters.yr.includes(String(getCol(row, 'Year')))) return false; 
            if (filters.mo && !filters.mo.includes(getCol(row, 'Month'))) return false;
            if (filters.comp && !filters.comp.includes(getCol(row, 'Burn Company', 'Company'))) return false; 
            if (filters.dept && !filters.dept.includes(getCol(row, 'Department'))) return false;
            if (filters.cc && !filters.cc.includes(getCol(row, 'Cost Center', 'Cost Centre'))) return false;
            const type = (getCol(row, 'Document Type', 'Type') || "").toUpperCase();
            const fname = (getCol(row, 'Full File Name') || "").toString().trim();
            const isReconciled = type.includes('ECF') || type.includes('TRF') || type.includes('INV');
            const isPendingPRF = (type.includes('PRF') || type.includes('PR')) && pendingFilesGlobal.includes(fname);
            switch(mode) {
                case 'COMM_TOTAL': return isReconciled || isPendingPRF;
                case 'COMM_PRF':   return isPendingPRF;
                case 'COMM_ECF':   return type.includes('ECF');
                case 'COMM_TRF':   return type.includes('TRF');
                case 'COMM_INV':   return type.includes('INV');
                case 'REC_TOTAL':  return isReconciled;
                case 'REC_ECF':    return type.includes('ECF');
                case 'REC_TRF':    return type.includes('TRF');
                case 'REC_INV':    return type.includes('INV');
                default: return false;
            }
        }).map(r => (getCol(r, 'Full File Name') || "").toString().trim());
        if (fileNameKey) tableFilters[fileNameKey] = validFiles;
        syncGlobalSelectionsToLedger(filters);
        syncFilterIcons();
        switchTab('approvals-tab', document.getElementById('btn-approvals'));
        renderApprovalsTable(appData);
    }

    function drillToLedgerByStatus(statusTarget) {
        tableFilters = {};
        const rawCols = Object.keys(appData[0] || {});
        const filters = getGlobalFiltersObj();
        const matchingFileNames = recData
            .filter(r => {
                const rowComp = getCol(r, 'Burn Company', 'Company'), rowDept = getCol(r, 'Department'), rowCC = getCol(r, 'Cost Center', 'Cost Centre'), rowMo = getCol(r, 'Month'), rowYr = String(getCol(r, 'Year'));
                if (filters.comp && !filters.comp.includes(rowComp)) return false;
                if (filters.dept && !filters.dept.includes(rowDept)) return false;
                if (filters.cc && !filters.cc.includes(rowCC)) return false;
                if (filters.yr && !filters.yr.includes(rowYr)) return false;
                if (filters.mo && !filters.mo.includes(rowMo)) return false;
                const d = parseExcelDate(getCol(r, 'Date Approved', 'Approval Date', 'PRF Date'));
                if ((filters.start && d < filters.start) || (filters.end && d > filters.end)) return false;
                return (getCol(r, 'Status') || "").toLowerCase().includes(statusTarget.toLowerCase());
            })
            .map(r => (getCol(r, 'PRF file') || "").toString().trim())
            .filter(name => name !== "");
        const fileNameKey = rawCols.find(k => k.toLowerCase().includes('full file name'));
        if (fileNameKey) tableFilters[fileNameKey] = matchingFileNames;
        syncGlobalSelectionsToLedger(filters);
        syncFilterIcons();
        switchTab('approvals-tab', document.getElementById('btn-approvals'));
        renderApprovalsTable(appData);
    }

    function drillToLedgerByAgeing(label) {
        tableFilters = {};
        const rawCols = Object.keys(appData[0] || {});
        const filters = getGlobalFiltersObj();
        const filteredFiles = recData.filter(r => {
            const rowComp = getCol(r, 'Burn Company', 'Company'), rowDept = getCol(r, 'Department'), rowCC = getCol(r, 'Cost Center', 'Cost Centre'), rowMo = getCol(r, 'Month'), rowYr = String(getCol(r, 'Year'));
            if (filters.comp && !filters.comp.includes(rowComp)) return false;
            if (filters.dept && !filters.dept.includes(rowDept)) return false;
            if (filters.cc && !filters.cc.includes(rowCC)) return false;
            if (filters.yr && !filters.yr.includes(rowYr)) return false;
            if (filters.mo && !filters.mo.includes(rowMo)) return false;
            const status = (getCol(r, 'Status') || "").toLowerCase();
            const overdue = cleanNum(getCol(r, 'Days Overdue'));
            if (!status.includes('pending') || overdue <= 0) return false;
            if (label === '1-7d') return overdue <= 7;
            if (label === '8-14d') return overdue > 7 && overdue <= 14;
            if (label === '15d+') return overdue > 14;
            return false;
        }).map(r => (getCol(r, 'PRF file') || "").toString().trim());
        const fileNameKey = rawCols.find(k => k.toLowerCase().includes('full file name'));
        if (fileNameKey) tableFilters[fileNameKey] = filteredFiles;
        syncGlobalSelectionsToLedger(filters);
        syncFilterIcons();
        switchTab('approvals-tab', document.getElementById('btn-approvals'));
        renderApprovalsTable(appData);
    }

    function getGlobalFiltersObj() {
        const norm = (dStr) => dStr ? new Date(dStr + "T00:00:00") : null;
        return { 
            start: norm(document.getElementById('dStart')?.value), 
            end: norm(document.getElementById('dEnd')?.value), 
            yr: getSelected('fYearList'), 
            mo: getSelected('fMonthList'), 
            comp: getSelected('fCompList'), 
            dept: getSelected('fDeptList'), 
            cc: getSelected('fCCList'), 
            deptGroup: getSelected('fDeptGroupList') 
        };
    }

    function syncGlobalSelectionsToLedger(filters) {
        const rawCols = Object.keys(appData[0] || {});
        if (filters.yr) { const k = rawCols.find(c => c.toLowerCase() === 'year'); if(k) tableFilters[k] = filters.yr; }
        if (filters.mo) { const k = rawCols.find(c => c.toLowerCase() === 'month'); if(k) tableFilters[k] = filters.mo; }
        if (filters.comp) { const k = rawCols.find(c => c.toLowerCase().includes('burn company') || c.toLowerCase() === 'company'); if(k) tableFilters[k] = filters.comp; }
        if (filters.dept) { const k = rawCols.find(c => c.toLowerCase() === 'department'); if(k) tableFilters[k] = filters.dept; }
        if (filters.cc) { const k = rawCols.find(c => c.toLowerCase().includes('cost center') || c.toLowerCase().includes('cost centre')); if(k) tableFilters[k] = filters.cc; }
        if (filters.deptGroup) { const k = rawCols.find(c => c.toLowerCase().includes('dept group') || c.toLowerCase().includes('department group')); if(k) tableFilters[k] = filters.deptGroup; }
    }

    function drillToLedger(costCenter, itemDriver = null) {
        tableFilters = {}; 
        const filters = getGlobalFiltersObj();
        const rawCols = Object.keys(appData[0] || {});
        const fileNameKey = rawCols.find(k => k.toLowerCase().includes('full file name'));
        const pendingFilesGlobal = recData.filter(r => (getCol(r, 'Status') || "").toLowerCase().includes('pending')).map(r => (getCol(r, 'PRF file') || "").toString().trim());

        const validFiles = appData.filter(row => {
            const rowDeptGroup = getCol(row, 'Department Group', 'Dept Group');
            if (selectedDeptGroup !== "ALL" && rowDeptGroup && rowDeptGroup !== selectedDeptGroup) return false;
            const rCC = getCol(row, 'Cost Center', 'Cost Centre');
            if (costCenter && rCC !== costCenter) return false;
            if (itemDriver) {
                const rawDriver = getCol(row, 'Cost Drivers', 'Driver');
                const driverStr = (rawDriver && rawDriver.toString().trim() !== "" && rawDriver.toString().trim() !== "-") ? rawDriver : "Unspecified";
                if (driverStr !== itemDriver) return false;
            }
            const d = parseExcelDate(getCol(row, 'Date Approved', 'Approval Date'));
            if ((filters.start && d < filters.start) || (filters.end && d > filters.end)) return false;
            if (filters.yr && !filters.yr.includes(String(getCol(row, 'Year')))) return false; 
            if (filters.mo && !filters.mo.includes(getCol(row, 'Month'))) return false;
            if (filters.comp && !filters.comp.includes(getCol(row, 'Burn Company', 'Company'))) return false; 
            const type = (getCol(row, 'Document Type', 'Type') || "").toUpperCase();
            const fname = (getCol(row, 'Full File Name') || "").toString().trim();
            return (type.includes('ECF') || type.includes('TRF') || type.includes('INV')) || ((type.includes('PRF') || type.includes('PR')) && pendingFilesGlobal.includes(fname));
        }).map(r => (getCol(r, 'Full File Name') || "").toString().trim());

        if (fileNameKey) tableFilters[fileNameKey] = validFiles;
        syncGlobalSelectionsToLedger(filters);
        syncFilterIcons();
        switchTab('approvals-tab', document.getElementById('btn-approvals'));
        renderApprovalsTable(appData);
    }

    function syncFilterIcons() {
        document.querySelectorAll('.header-filter-icon').forEach(icon => {
            const colName = icon.id.replace('icon_colDrop_', '').replace(/_/g, ' ');
            icon.classList.remove('active');
            for (let filterKey in tableFilters) {
                if (filterKey === colName || (colName === 'Cost Center' && (filterKey.toLowerCase().includes('cost center') || filterKey.toLowerCase().includes('cost centre'))) || (colName === 'Date Approved' && filterKey.toLowerCase().includes('date')) || (colName === 'Month' && filterKey.toLowerCase() === 'month') || (colName === 'Year' && filterKey.toLowerCase() === 'year')) {
                    icon.classList.add('active');
                }
            }
        });
    }

    function toggleDropdown(id) { document.querySelectorAll('.dropdown-content, .col-dropdown-container').forEach(d => { if(d.id !== id) d.classList.remove('show'); }); const el = document.getElementById(id); if (el) el.classList.toggle('show'); }
    window.onclick = function(event) { if (!event.target.matches('.multiselect-container') && !event.target.closest('.dropdown-content') && !event.target.closest('.col-dropdown-container') && !event.target.matches('.header-filter-icon')) { document.querySelectorAll('.dropdown-content, .col-dropdown-container').forEach(d => d.classList.remove('show')); } }

    const SHEET_ID = "164nSeGrs3Wx_dLdUeoSVanRWzRpcuQic1sCwcgtGmAo";
    function fetchSheet(sheetName) {
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}&t=${Date.now()}`;
        return fetch(url).then(res => {
            if (!res.ok) throw new Error("Fetch failed");
            return res.text();
        }).then(text => {
            const json = JSON.parse(text.substring(47).slice(0, -2));
            const cols = json.table.cols.map(c => (c.label || "").trim());
            return json.table.rows.map(r => { let obj = {}; r.c.forEach((cell, i) => { if(cols[i]) obj[cols[i]] = cell ? (cell.v !== null ? cell.v : "") : ""; }); return obj; });
        });
    }

    async function fetchData() {
        try {
            const [a, b, c, d] = await Promise.all([fetchSheet("Approvals"), fetchSheet("Reconciliation Report"), fetchSheet("P&L Costs Summary"), fetchSheet("Sales")]);
            appData = a; recData = b; pnlData = c; salesData = d;
            document.getElementById('status').innerText = "SYSTEM ONLINE • " + new Date().toLocaleTimeString();
            initFilters(); updateDashboard(); renderApprovalsTable(appData);
        } catch (e) { console.error(e); document.getElementById('status').innerText = "LINK SEVERED"; }
    }

    function initFilters() {
        const fill = (id, labelId, data, keys, placeholder) => {
            const el = document.getElementById(id); if (!el || el.children.length > 0) return;
            const vals = [...new Set(data.map(r => getCol(r, ...keys)).filter(v => v))].sort();
            const sa = document.createElement('div'); sa.className = 'dropdown-item'; sa.style.borderBottom = '2px solid var(--primary)';
            sa.innerHTML = `<input type="checkbox" onchange="toggleAllFilters('${id}', '${labelId}', '${placeholder}', this.checked)"> <b>SELECT ALL</b>`;
            el.appendChild(sa);
            vals.forEach(v => { const item = document.createElement('div'); item.className = 'dropdown-item'; item.innerHTML = `<input type="checkbox" value="${v}" onchange="updateFilterLabel('${id}', '${labelId}', '${placeholder}')"> ${v}`; el.appendChild(item); });
        };
        fill('fCompList', 'fCompLabel', appData, ['Burn Company', 'Company'], 'Entities'); 
        fill('fDeptList', 'fDeptLabel', appData, ['Department'], 'Departments'); 
        fill('fCCList', 'fCCLabel', appData, ['Cost Center', 'Cost Centre'], 'Cost Centers'); 
        fill('fMonthList', 'fMonthLabel', appData, ['Month'], 'Months'); 
        fill('fYearList', 'fYearLabel', appData, ['Year'], 'Years');
        fill('fDeptGroupList', 'fDeptGroupLabel', appData, ['Department Group', 'Dept Group'], 'Dept Groups');
    }

    function updateFilterLabel(containerId, labelId, placeholder) {
        const checked = getSelected(containerId); const labelEl = document.getElementById(labelId);
        if (checked) { labelEl.classList.add('active-filter'); labelEl.innerText = checked.length === 1 ? checked[0] : `${checked.length} ${placeholder} Selected`; }
        else { labelEl.innerText = `Select ${placeholder}...`; labelEl.classList.remove('active-filter'); }
        updateDashboard();
    }

    function toggleAllFilters(containerId, labelId, placeholder, checked) { document.querySelectorAll(`#${containerId} input`).forEach(i => i.checked = checked); updateFilterLabel(containerId, labelId, placeholder); }
    function getSelected(id) { const checked = Array.from(document.querySelectorAll(`#${id} input:checked`)).map(i => i.value).filter(v => v); return checked.length > 0 ? checked : null; }
    
    function resetGlobalFilters() {
        if (document.getElementById('dStart')) document.getElementById('dStart').value = ''; 
        if (document.getElementById('dEnd')) document.getElementById('dEnd').value = '';
        document.querySelectorAll('#global-filters .dropdown-content input').forEach(i => i.checked = false);
        [['fYearList', 'fYearLabel', 'Years'],['fMonthList', 'fMonthLabel', 'Months'],['fCompList', 'fCompLabel', 'Entities'],['fDeptList', 'fDeptLabel', 'Departments'],['fCCList', 'fCCLabel', 'Cost Centers'],['fDeptGroupList', 'fDeptGroupLabel', 'Dept Groups']].forEach(c => { const labelEl = document.getElementById(c[1]); if(labelEl) { labelEl.innerText = `Select ${c[2]}...`; labelEl.classList.remove('active-filter'); }});
        selectedCCForDrivers = null;
        updateDashboard();
    }

    function resetLedgerFilters() { tableFilters = {}; amountSortOrder = 'desc'; document.querySelectorAll('.col-dropdown-container input').forEach(i => i.checked = false); document.querySelectorAll('.header-filter-icon').forEach(icon => icon.classList.remove('active')); renderApprovalsTable(appData); }

    // --- BLOCK 2 & 3: DASHBOARD UPDATE & CHARTS ---

            if (filters.yr && !filters.yr.includes(String(getCol(row, 'Year')))) return;

            if (type.includes('ECF')) { ecf += amt; isCommitted = true; } 
            else if (type.includes('TRF')) { trf_actual += amt; isCommitted = true; }

            if (isCommitted) {

        document.getElementById('subCommInv').innerText = fmt(inv);
        document.getElementById('valActual').innerText = fmt(ecf+trf_actual+inv); 
        document.getElementById('subECF').innerText = fmt(ecf); 
        document.getElementById('subTRF').innerText = fmt(trf_actual);

        document.getElementById('subSalesQty').innerText = totalSalesQty.toLocaleString();
        document.getElementById('valUnitPNLTotal').innerText = fmt(totalComm);

        recData.forEach(r => {
            const rowDeptGroup = getCol(r, 'Department Group', 'Dept Group');
            const rowComp = getCol(r, 'Burn Company', 'Company'), rowDept = getCol(r, 'Department'), rowCC = getCol(r, 'Cost Center', 'Cost Centre'), rowMo = getCol(r, 'Month'), rowYr = String(getCol(r, 'Year'));
            if (filters.deptGroup && !filters.deptGroup.includes(rowDeptGroup)) return;

            if (filters.cc && !filters.cc.includes(rowCC)) return;

            const status = (getCol(r, 'Status')||"").toLowerCase(), amt = cleanNum(getCol(r, 'PRF Amount (USD)')), cc = rowCC || "Misc", overdue = cleanNum(getCol(r, 'Days Overdue')), daysToRec = cleanNum(getCol(r, 'Actual Recon Days')), maxDays = cleanNum(getCol(r, 'Max Reconciliation Days')), pendDays = cleanNum(getCol(r, 'Days Pending'));
            if (status.includes('reconciled')) { recSum += amt; recCount++; if(daysToRec <= 30) recWithin30++; }

        const avgMax = count > 0 ? (mDaysTotal / count) : 0;

            listElement.insertAdjacentHTML('beforeend', `<div style="background:#0f172a; padding:5px; font-weight:900; color:var(--primary); font-size:10px;">${yr}</div>`);
            Object.keys(dateMap[yr]).sort((a,b) => monthNames.indexOf(a) - monthNames.indexOf(b)).forEach(mo => {
                listElement.insertAdjacentHTML('beforeend', `<div style="padding:2px 10px; font-weight:700; color:var(--text-light); font-size:9px;">${mo}</div>`);
                Array.from(dateMap[yr][mo]).sort().forEach(date => { listElement.insertAdjacentHTML('beforeend', `<div class="dropdown-item" style="padding-left: 20px;"><input type="checkbox" data-key="${originalKey}" value="${date}" onchange="updateTableFilter('${originalKey}', '${dropId}')"> ${date.split('/')[0]}</div>`); });
            });
        });
    }

    function searchColOptions(id, query) { const container = document.getElementById(`${id}_list`); const items = container.querySelectorAll('.dropdown-item'); items.forEach(item => { item.style.display = item.innerText.toLowerCase().includes(query.toLowerCase()) ? 'flex' : 'none'; }); }
    function toggleAllTableFilters(dropId, checked) { const container = document.getElementById(`${dropId}_list`); const vis = Array.from(container.querySelectorAll('.dropdown-item')).filter(div => div.style.display !== 'none').map(div => div.querySelector('input')); if (vis.length > 0) { const oKey = vis[0].getAttribute('data-key'); vis.forEach(i => i.checked = checked); updateTableFilter(oKey, dropId); } }
    function updateTableFilter(originalKey, dropId) { const list = document.getElementById(`${dropId}_list`); const checked = Array.from(list.querySelectorAll('input:checked')).map(i => i.value); if (checked.length > 0) tableFilters[originalKey] = checked; else delete tableFilters[originalKey]; renderApprovalsTable(appData); }
    function updateExecSummary(comp, speed) { updateExecRow('exComp', comp, 100, false, '%'); updateExecRow('exSpeed', speed, 30, true, ' Days'); }
    function updateExecRow(id, val, target, lowerIsBetter, unit) { const vEl = document.getElementById(id + 'Val'), tEl = document.getElementById(id + 'Trend'); if(!vEl || !tEl) return; const isGood = lowerIsBetter ? val <= target : val >= target; vEl.innerText = val.toFixed(0) + unit; vEl.style.color = isGood ? 'var(--green)' : 'var(--red)'; tEl.innerHTML = `<span class="trend-pill ${isGood ? 'bg-good-pill' : 'bg-bad-pill'}">${isGood ? 'OPTIMAL' : 'RISK DETECTED'}</span>`; }
    
    function updateVisuals(rec, pen, ageData, rankMap) {
        if(mixChart) { mixChart.data.datasets[0].data = [rec, pen]; mixChart.update(); }
        if(ageChart) { ageChart.data.datasets[0].data = ageData; ageChart.update(); }
        const rl = document.getElementById('healthRankList'); rl.innerHTML = '';
        Object.keys(rankMap).sort((a,b) => (rankMap[b].sum/rankMap[b].count) - (rankMap[a].sum/rankMap[a].count)).slice(0, 5).forEach(cc => { 
            const sc = (rankMap[cc].sum / rankMap[cc].count).toFixed(0); let c = sc > 80 ? 'var(--green)' : (sc < 50 ? 'var(--red)' : 'var(--primary)'); 
            rl.insertAdjacentHTML('beforeend', `<div class="rank-item"><div class="rank-top-row"><div class="rank-label" title="${cc}">${cc}</div><div class="rank-pct">${sc}%</div></div><div class="rank-bar-bg"><div class="rank-bar-fill" style="width:${sc}%; background:${c}"></div></div></div>`); 
        });
    }

    window.onload = () => {
        const needle = { id: 'needle', afterDraw(chart) { const { ctx, data } = chart; ctx.save(); const meta = chart.getDatasetMeta(0).data[0], total = data.datasets[0].data.reduce((a, b) => a + b, 0), value = data.datasets[0].data[0], x = meta.x, y = meta.y - 10, rad = 18, pct = total > 0 ? value / total : 0, ang = Math.PI + (Math.PI * pct); ctx.translate(x, y); ctx.save(); ctx.rotate(ang); ctx.beginPath(); ctx.fillStyle = '#ffffff'; ctx.moveTo(rad - 2, -3); ctx.lineTo(meta.outerRadius - 30, -0.5); ctx.lineTo(meta.outerRadius - 30, 0.5); ctx.lineTo(rad - 2, 3); ctx.closePath(); ctx.fill(); ctx.restore(); ctx.beginPath(); ctx.arc(0, 0, rad, 0, Math.PI * 2); ctx.fillStyle = '#1e293b'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.fill(); ctx.stroke(); ctx.font = 'bold 12px Inter'; ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText((pct * 100).toFixed(0) + '%', 0, 0); ctx.restore(); } };
        
        mixChart = new Chart(document.getElementById('mixChart'), { type: 'doughnut', plugins: [needle], data: { labels: ['Rec', 'Pen'], datasets: [{ backgroundColor: ['#00ff9d', '#ff4d4d'], data: [0,0], borderWidth: 0, circumference: 180, rotation: 270 }] }, options: { maintainAspectRatio: false, cutout: '85%', plugins: { legend: { display: false } } } });
        
        ageChart = new Chart(document.getElementById('ageChart'), { type: 'pie', data: { labels: ['1-7d', '8-14d', '15d+'], datasets: [{ backgroundColor: ['#f1c40f', '#e67e22', '#e74c3c'], data: [0,0,0], borderWidth: 0 }] }, options: { maintainAspectRatio: false, onClick: (evt, elements) => { if (elements.length > 0) drillToLedgerByAgeing(ageChart.data.labels[elements[0].index]); }, plugins: { legend: { position: 'bottom', labels: { color: '#ffffff' } } } } });
        
        const commonScaleOptions = { ticks: { color: '#ffffff', font: { size: 12, weight: '700' } }, grid: { display: false } };
        
        trendChart = new Chart(document.getElementById('trendChart'), { type: 'bar', data: { labels: [], datasets: [{ label: 'Sales Qty', data: [], backgroundColor: 'rgba(0, 210, 255, 0.25)', borderColor: '#00d2ff', borderWidth: 2, yAxisID: 'y' }, { label: 'Comm. Cost/Unit', data: [], type: 'line', borderColor: '#00ff9d', backgroundColor: '#00ff9d', yAxisID: 'y1' }] }, options: { maintainAspectRatio: false, scales: { x: commonScaleOptions, y: { ...commonScaleOptions, beginAtZero: true }, y1: { ...commonScaleOptions, position: 'right' } } } });
        
        weeklyPnlChart = new Chart(document.getElementById('weeklyPnlChart'), { type: 'bar', data: { labels: [], datasets: [{ label: 'Actual Spend', data: [] }, { label: 'Committed Spend', data: [], type: 'line' }] }, options: { maintainAspectRatio: false, onClick: (evt, elements) => { if (elements.length > 0) { const key = currentSortedTrendKeys[elements[0].index]; if (key) drillToLedgerByTrendPoint(key); } } } });
        
        companyDistChart = new Chart(document.getElementById('companyDistChart'), { type: 'bar', data: { labels: [], datasets: [{ data: [] }] }, options: { indexAxis: 'y', maintainAspectRatio: false } });
        
        unitCostCompChart = new Chart(document.getElementById('unitCostCompChart'), { type: 'bar', data: { labels: [], datasets: [{ data: [] }] }, options: { indexAxis: 'y', maintainAspectRatio: false } });
        
        fetchData(); 
        setInterval(fetchData, 60000);
    };
</script>
</body>
