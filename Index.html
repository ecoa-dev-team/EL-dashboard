<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance & Operations Command Center</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --primary: #00d2ff;
            --secondary: #00ff9d;
            --orange: #ff9f43;
            --red: #ff4d4d;
            --green: #00ff9d;
            --text-light: #94a3b8;
            --white: #ffffff;
        }
        body { background: var(--bg); color: var(--white); font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        /* Layout & Tab Styles */
        .tab-content { display: none; padding: 20px; }
        .tab-content.active { display: block; }
        .tab-btn { cursor: pointer; padding: 10px 20px; background: var(--card); border: none; color: var(--text-light); }
        .tab-btn.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        /* Dashboard UI Elements */
        .rank-item { background: rgba(255,255,255,0.05); padding: 10px; margin-bottom: 8px; border-radius: 4px; }
        .rank-top-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .rank-label-link { cursor: pointer; text-decoration: underline; color: var(--primary); }
        .rank-bar-bg { background: #334155; height: 8px; border-radius: 4px; overflow: hidden; }
        .rank-bar-fill { height: 100%; transition: width 0.3s ease; }
        .rank-footer { display: flex; justify-content: space-between; font-size: 10px; margin-top: 5px; color: var(--text-light); }
        /* Table Styles */
        table { width: 100%; border-collapse: collapse; background: var(--card); font-size: 12px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
        .status-text-green { color: var(--green); font-weight: bold; }
        .status-text-orange { color: var(--orange); font-weight: bold; }
        .pdf-btn { color: var(--primary); text-decoration: none; font-weight: bold; }
        /* Dropdowns & Filters */
        .col-dropdown-container { display: none; position: absolute; background: var(--card); border: 1px solid var(--primary); z-index: 100; max-height: 300px; overflow-y: auto; }
        .show { display: block; }
    </style>
</head>
<body>

<div id="global-filters">
    <div id="status">SYSTEM INITIALIZING...</div>
</div>

<div class="tabs">
    <button class="tab-btn active" id="btn-dashboard" onclick="switchTab('dashboard', this)">DASHBOARD</button>
    <button class="tab-btn" id="btn-cost" onclick="switchTab('cost-analysis', this)">COST ANALYSIS</button>
    <button class="tab-btn" id="btn-approvals" onclick="switchTab('approvals-tab', this)">LEDGER</button>
</div>

<div id="dashboard" class="tab-content active">
    <div id="valEfficiency">0%</div>
    <div id="vOverLabel">Avg Overdue</div><div id="vOver">0 Days</div>
</div>

<div id="cost-analysis" class="tab-content">
    <div id="itemDriverTitle">Item Drivers (Committed)</div>
    <div id="driverRankList"></div>
    <div id="costDriverList"></div>
</div>

<div id="approvals-tab" class="tab-content">
    <div id="ledger-summary">TOTAL: $0.00</div>
    <table>
        <thead id="approvalsHead"></thead>
        <tbody id="approvalsBody"></tbody>
    </table>
</div>

<script>
    Chart.register(ChartDataLabels);

    let appData = [], recData = [], pnlData = [], salesData = [];
    let tableFilters = {}, amountSortOrder = 'desc', ccSortOrder = 'desc', itemSortOrder = 'desc';
    let selectedCCForDrivers = null, selectedDeptGroup = "ALL", currentGranularity = 'monthly';
    let ccCurrentPage = 1, itemCurrentPage = 1;
    const ITEMS_PER_PAGE = 10;
    const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const ENTITY_TO_SALES_COUNTRY_MAP = { 'Burn Manufacturing Kenya': 'Kenya', 'Burn Manufacturing DRC': 'DRC' };

    let mixChart, ageChart, trendChart, weeklyPnlChart, companyDistChart, unitCostCompChart;

    // --- Helper Functions ---
    const cleanNum = (v) => { if (v === null || v === undefined || v === "") return 0; if (typeof v === 'number') return v; return parseFloat(v.toString().replace(/[^\d.-]/g, '')) || 0; };
    const getCol = (row, ...keys) => { const found = Object.keys(row).find(k => keys.some(s => k.toLowerCase().trim() === s.toLowerCase().trim())); return found ? row[found] : null; };
    const parseExcelDate = (val) => { if (!val) return null; if (val instanceof Date) return new Date(val.setHours(0,0,0,0)); let s = val.toString().trim(); const gDateMatch = s.match(/Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?\)/); if (gDateMatch) { const [_, y, m, d] = gDateMatch; return new Date(y, m, d, 0, 0, 0, 0); } const dotMatch = s.split('.'); if (dotMatch.length === 3) return new Date(dotMatch[2], dotMatch[1] - 1, dotMatch[0], 0, 0, 0, 0); const iso = new Date(s); return !isNaN(iso.getTime()) ? new Date(iso.getFullYear(), iso.getMonth(), iso.getDate(), 0, 0, 0, 0) : null; };
    const formatDateStr = (d) => (!d || isNaN(d.getTime())) ? '-' : `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
    const getWeekNumber = (d) => { d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7)); let yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1)); return Math.ceil(( ( (d - yearStart) / 86400000) + 1)/7); };
    const getQuarter = (d) => 'Q' + Math.floor((d.getMonth() + 3) / 3);

    // --- Core Logic ---
    function updateDashboard() {
        const activeTab = document.querySelector('.tab-content.active').id;
        const filters = getGlobalFiltersObj();
        let ecf = 0, trf_actual = 0, inv = 0, totalSalesQty = 0, totalPendingPrfAmt = 0;
        let ccCommittedMap = {}, salesTrendAgg = {}, companyCommittedAgg = {}, commitTrendAgg = {}, countrySalesMap = {};
        
        let pendingPrfSet = new Set(recData.filter(r => (getCol(r, 'Status')||"").toLowerCase().includes('pending')).map(r => (getCol(r, 'PRF file')||"").toString().trim()));

        const getTrendKey = (date) => {
            if (!date) return null;
            if (currentGranularity === 'weekly') return { sort: `${date.getFullYear()}-${getWeekNumber(date).toString().padStart(2, '0')}`, display: `W${getWeekNumber(date)}` };
            if (currentGranularity === 'monthly') return { sort: `${date.getFullYear()}-${(date.getMonth() + 1).toString().padStart(2, '0')}`, display: monthNames[date.getMonth()].substring(0,3) };
            return { sort: `${date.getFullYear()}-${getQuarter(date)}`, display: getQuarter(date) };
        };

        appData.forEach(row => {
            const rowDeptGroup = getCol(row, 'Department Group', 'Dept Group');
            if (activeTab === 'cost-analysis' ? (selectedDeptGroup !== "ALL" && rowDeptGroup !== selectedDeptGroup) : (filters.deptGroup && !filters.deptGroup.includes(rowDeptGroup))) return;
            const d = parseExcelDate(getCol(row, 'Date Approved', 'Approval Date'));
            if ((filters.start && d < filters.start) || (filters.end && d > filters.end)) return;
            if (filters.yr && !filters.yr.includes(String(getCol(row, 'Year')))) return;
            if (filters.comp && !filters.comp.includes(getCol(row, 'Burn Company', 'Company'))) return;

            const amt = cleanNum(getCol(row, 'Amount (USD)'));
            const type = (getCol(row, 'Document Type', 'Type') || "").toUpperCase();
            const fname = (getCol(row, 'Full File Name') || "").toString().trim();
            const rComp = getCol(row, 'Burn Company', 'Company'), rCC = getCol(row, 'Cost Center', 'Cost Centre') || "Misc";

            let isCommitted = false;
            if (type.includes('ECF')) { ecf += amt; isCommitted = true; }
            else if (type.includes('TRF')) { trf_actual += amt; isCommitted = true; }
            else if (type.includes('INV')) { inv += amt; isCommitted = true; }
            else if (pendingPrfSet.has(fname)) { totalPendingPrfAmt += amt; isCommitted = true; }

            if (isCommitted) {
                const tObj = getTrendKey(d);
                if (tObj) {
                    if (!commitTrendAgg[tObj.sort]) commitTrendAgg[tObj.sort] = { val: 0, label: tObj.display };
                    commitTrendAgg[tObj.sort].val += amt;
                }
                ccCommittedMap[rCC] = (ccCommittedMap[rCC] || 0) + amt;
                companyCommittedAgg[rComp] = (companyCommittedAgg[rComp] || 0) + amt;
            }
        });

        // Reconciliation Metrics
        let recCount = 0, penCount = 0, recSum = 0, penSum = 0, mDaysTotal = 0, pDaysTotal = 0, count = 0, recWithin30 = 0, ccMap = {}, a1 = 0, a2 = 0, a3 = 0;
        recData.forEach(r => {
            const status = (getCol(r, 'Status')||"").toLowerCase(), amt = cleanNum(getCol(r, 'PRF Amount (USD)')), overdue = cleanNum(getCol(r, 'Days Overdue')), daysToRec = cleanNum(getCol(r, 'Actual Recon Days'));
            if (status.includes('reconciled')) { recSum += amt; recCount++; if(daysToRec <= 30) recWithin30++; }
            else { penSum += amt; penCount++; if (overdue > 0) { if (overdue <= 7) a1++; else if (overdue <= 14) a2++; else a3++; } }
            mDaysTotal += cleanNum(getCol(r, 'Max Reconciliation Days')); pDaysTotal += cleanNum(getCol(r, 'Days Pending')); count++;
            let cc = getCol(r, 'Cost Center') || "Misc";
            if (!ccMap[cc]) ccMap[cc] = { sum: 0, count: 0 }; ccMap[cc].sum += cleanNum(getCol(r, 'Efficiency %')); ccMap[cc].count++;
        });

        // Update DOM Elements
        const totalComm = totalPendingPrfAmt + ecf + trf_actual + inv;
        globalTotalComm = totalComm;
        const avgMax = count > 0 ? (mDaysTotal / count) : 0, avgPend = count > 0 ? (pDaysTotal / count) : 0;
        
        document.getElementById('vEff').innerText = (recCount + penCount) > 0 ? ((recCount / (recCount + penCount)) * 100).toFixed(0) + "%" : "0%";
        document.getElementById('vOver').innerText = Math.abs(avgMax - avgPend).toFixed(0) + " Days";
        document.getElementById('ledger-summary').innerText = "TOTAL: " + totalComm.toLocaleString('en-US', {style:'currency', currency:'USD'});

        updateExecSummary((recCount+penCount)>0 ? (recWithin30/(recCount+penCount))*100 : 0, avgPend);
        updateVisuals(recCount, penCount, [a1, a2, a3], ccMap);
        
        ccDataFull = Object.entries(ccCommittedMap).sort((a,b) => ccSortOrder === 'desc' ? b[1] - a[1] : a[1] - b[1]);
        renderCCDriversList();
        updateCostDashboardVisuals(salesTrendAgg, totalComm, totalSalesQty, commitTrendAgg, countrySalesMap, companyCommittedAgg);
        updateItemDriversData();
    }

    // --- View Functions ---
    function renderCCDriversList() {
        const dl = document.getElementById('driverRankList'); if(!dl) return; dl.innerHTML = '';
        const pagedData = ccDataFull.slice((ccCurrentPage - 1) * ITEMS_PER_PAGE, ccCurrentPage * ITEMS_PER_PAGE);
        const absMax = ccDataFull.reduce((a,b) => Math.max(a, b[1]), 0);
        pagedData.forEach(([cc, val]) => {
            dl.insertAdjacentHTML('beforeend', `<div class="rank-item">
                <div class="rank-top-row">
                    <div class="rank-label rank-label-link" onclick="drillToCCFromRank('${cc.replace(/'/g, "\\'")}')">${cc}</div>
                    <div class="rank-impact-val">$${(val/1000).toFixed(1)}k</div>
                </div>
                <div class="rank-bar-bg"><div class="rank-bar-fill" style="width:${(val/absMax*100).toFixed(0)}%; background:var(--primary)"></div></div>
            </div>`);
        });
    }

    function renderApprovalsTable(sourceData) {
        const body = document.getElementById('approvalsBody'); if(!body) return;
        body.innerHTML = '';
        sourceData.forEach(row => {
            let tr = `<tr><td>${getCol(row, 'Department') || '-'}</td><td>${getCol(row, 'Cost Center') || '-'}</td><td>${cleanNum(getCol(row, 'Amount (USD)')).toLocaleString()}</td><td><a href="${getCol(row, 'Link')}" target="_blank" class="pdf-btn">VIEW</a></td></tr>`;
            body.insertAdjacentHTML('beforeend', tr);
        });
    }

    // --- Initialization & Data Fetching ---
    const SHEET_ID = "164nSeGrs3Wx_dLdUeoSVanRWzRpcuQic1sCwcgtGmAo";
    async function fetchSheet(sheetName) {
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}&t=${Date.now()}`;
        const res = await fetch(url);
        const text = await res.text();
        const json = JSON.parse(text.substring(47).slice(0, -2));
        const cols = json.table.cols.map(c => (c.label || "").trim());
        return json.table.rows.map(r => { let obj = {}; r.c.forEach((cell, i) => { if(cols[i]) obj[cols[i]] = cell ? (cell.v !== null ? cell.v : "") : ""; }); return obj; });
    }

    async function fetchData() {
        try {
            [appData, recData, pnlData, salesData] = await Promise.all([fetchSheet("Approvals"), fetchSheet("Reconciliation Report"), fetchSheet("P&L Costs Summary"), fetchSheet("Sales")]);
            document.getElementById('status').innerText = "SYSTEM ONLINE • " + new Date().toLocaleTimeString();
            updateDashboard(); renderApprovalsTable(appData);
        } catch (e) { document.getElementById('status').innerText = "LINK SEVERED"; }
    }

    // --- Tab & Sorting UI ---
    function switchTab(id, btn) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active'); 
        if (btn) btn.classList.add('active');
        updateDashboard();
    }

    function getGlobalFiltersObj() {
        const norm = (id) => { const v = document.getElementById(id); return v && v.value ? new Date(v.value + "T00:00:00") : null; };
        return { start: norm('dStart'), end: norm('dEnd'), yr: null, mo: null, comp: null, dept: null, cc: null, deptGroup: null };
    }

    function updateExecSummary(comp, speed) { /* Implementation for exComp, exSpeed labels */ }
    function updateVisuals(rec, pen, ageData, rankMap) {
        if(mixChart) { mixChart.data.datasets[0].data = [rec, pen]; mixChart.update(); }
        if(ageChart) { ageChart.data.datasets[0].data = ageData; ageChart.update(); }
    }

    // --- Charts Initialization ---
    window.onload = () => {
        const mixCtx = document.getElementById('mixChart');
        if(mixCtx) mixChart = new Chart(mixCtx, { type: 'doughnut', data: { labels: ['Rec', 'Pen'], datasets: [{ backgroundColor: ['#00ff9d', '#ff4d4d'], data: [0,0] }] }, options: { maintainAspectRatio: false } });
        
        const ageCtx = document.getElementById('ageChart');
        if(ageCtx) ageChart = new Chart(ageCtx, { type: 'pie', data: { labels: ['1-7d', '8-14d', '15d+'], datasets: [{ backgroundColor: ['#f1c40f', '#e67e22', '#e74c3c'], data: [0,0,0] }] }, options: { maintainAspectRatio: false } });

        fetchData();
        setInterval(fetchData, 60000);
    };

    // Placeholder functions for missing UI updates
    function updateCostDashboardVisuals() {}
    function drillToCCFromRank(cc) { selectedCCForDrivers = cc; updateDashboard(); }
    function updateItemDriversData() {}
    function renderItemDriversList() {}
</script>
</body>
</html>
