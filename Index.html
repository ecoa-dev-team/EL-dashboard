<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ELECTRIC SMT Command Center</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        :root { 
            --primary: #00d2ff; 
            --accent: #1e293b;
            --green: #00ff9d; 
            --red: #ff4d4d; 
            --orange: #ff9f43; 
            --bg: #0f172a; 
            --card: #1e293b; 
            --dark-blue: #0f172a; 
            --text-main: #ffffff;
            --text-light: #cbd5e1;
            --border: #475569;
        }
        
        * { box-sizing: border-box; }
        body { font-family: 'Inter', 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 12px; color: var(--text-main); font-size: 12px; line-height: 1.4; }
        
        /* Navigation Tabs */
        .nav-container { display: flex; gap: 5px; margin-bottom: 15px; border-bottom: 1px solid var(--border); }
        .nav-tab { 
            padding: 10px 20px; cursor: pointer; background: var(--card); border: 1px solid var(--border); 
            border-bottom: none; border-radius: 8px 8px 0 0; font-weight: 800; color: var(--text-light);
            text-transform: uppercase; letter-spacing: 1px; transition: 0.3s;
        }
        .nav-tab.active { background: var(--primary); color: var(--dark-blue); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 2px solid var(--primary); padding-bottom: 8px; }
        .header h3 { font-weight: 800; letter-spacing: 1px; color: var(--primary); text-transform: uppercase; margin: 0; }
        
        /* Filter Styles */
        .filter-section { display: flex; flex-wrap: wrap; gap: 10px; background: var(--card); padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid var(--border); align-items: flex-end; }
        .f-group { display: flex; flex-direction: column; min-width: 140px; flex: 1; position: relative; }
        .f-group label { font-size: 10px; font-weight: 800; color: var(--text-light); text-transform: uppercase; margin-bottom: 4px; }
        
        .multiselect-container { background: #0f172a; color: white; border: 1px solid var(--primary); border-radius: 5px; font-size: 11px; height: 32px; cursor: pointer; display: flex; align-items: center; padding: 0 10px; overflow: hidden; white-space: nowrap; }
        .dropdown-content { display: none; position: absolute; top: 50px; left: 0; background: #1e293b; border: 1px solid var(--primary); width: 100%; z-index: 100; max-height: 250px; overflow-y: auto; border-radius: 5px; }
        .dropdown-content.show { display: block; }
        .dropdown-item { padding: 8px 10px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #334155; }

        select, input { background: #0f172a; color: white; padding: 4px 10px; border: 1px solid var(--primary); border-radius: 5px; font-size: 11px; height: 32px; outline: none; }

        /* Dashboard Components */
        .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 12px; }
        .tile { background: var(--card); padding: 15px; border-radius: 8px; text-align: center; border: 1px solid var(--border); }
        .tile-val { font-size: 1.8rem; font-weight: 900; margin: 4px 0; }

        /* Table Styles for Approvals Tab */
        .table-container { background: var(--card); border-radius: 8px; border: 1px solid var(--border); overflow: hidden; }
        .search-bar { width: 100%; padding: 12px; background: #0f172a; border: none; border-bottom: 1px solid var(--border); color: white; font-weight: 600; }
        .data-table { width: 100%; border-collapse: collapse; color: var(--text-light); }
        .data-table th { background: #334155; color: var(--primary); text-align: left; padding: 12px; font-size: 10px; text-transform: uppercase; position: sticky; top: 0; }
        .data-table td { padding: 10px 12px; border-bottom: 1px solid #334155; }
        .data-table tr:hover { background: rgba(0, 210, 255, 0.05); }
        
        /* PDF Link Button */
        .pdf-btn { 
            background: #2563eb; color: white; text-decoration: none; padding: 5px 10px; 
            border-radius: 4px; font-size: 9px; font-weight: 900; text-transform: uppercase;
            transition: 0.2s; display: inline-block; border: 1px solid #60a5fa;
        }
        .pdf-btn:hover { background: var(--primary); color: var(--dark-blue); }

        .viz-grid { display: grid; grid-template-columns: 1fr 1fr 1.5fr; gap: 12px; height: 380px; margin-bottom: 12px; }
        .chart-box { background: var(--card); padding: 16px; border-radius: 8px; border: 1px solid var(--border); position: relative; }

        button { background: var(--primary); color: #0f172a; border: none; padding: 0 20px; border-radius: 5px; font-weight: 900; cursor: pointer; text-transform: uppercase; }
        #status { font-size: 11px; font-weight: 900; color: var(--green); }
    </style>
</head>
<body>

    <div class="header">
        <h3>ELECTRIC SMT COMMAND CENTER</h3>
        <div id="status">ESTABLISHING LINK...</div>
    </div>

    <div class="nav-container">
        <div class="nav-tab active" onclick="switchTab('dashboard', this)">Analytics Dashboard</div>
        <div class="nav-tab" onclick="switchTab('approvals', this)">Approvals Registry</div>
    </div>

    <div id="dashboard" class="tab-content active">
        <div class="filter-section">
            <div class="f-group"><label>Date From</label><input type="date" id="dStart" onchange="updateDashboard()"></div>
            <div class="f-group"><label>Date To</label><input type="date" id="dEnd" onchange="updateDashboard()"></div>
            <div class="f-group"><label>Fiscal Year</label><div class="multiselect-container" onclick="toggleDropdown('fYearList')">Select Years...</div><div id="fYearList" class="dropdown-content"></div></div>
            <div class="f-group"><label>Entity</label><div class="multiselect-container" onclick="toggleDropdown('fCompList')">Select Entities...</div><div id="fCompList" class="dropdown-content"></div></div>
            <button onclick="resetFilters()" style="height:32px;">RESET FILTERS</button>
        </div>

        <div class="kpi-grid">
            <div class="tile" style="border-top: 4px solid var(--primary);">
                <span class="tile-label">Committed (PRF)</span>
                <div class="tile-val" id="valPRF">$0</div>
            </div>
            <div class="tile" style="border-top: 4px solid var(--orange);">
                <span class="tile-label">Total Actual Spend</span>
                <div class="tile-val" id="valActual">$0</div>
            </div>
            <div class="tile" style="border-top: 4px solid var(--green);">
                <span class="tile-label">P&L Cost Impact</span>
                <div class="tile-val" id="valPNL">$0</div>
            </div>
        </div>

        <div class="viz-grid">
            <div class="chart-box">
                <h3 style="text-align: center; color: var(--primary); font-size: 12px;">GLOBAL COMPLIANCE</h3>
                <canvas id="mixChart"></canvas>
            </div>
            <div class="chart-box">
                <h3 style="color: var(--orange); font-size: 12px;">OVERDUE AGEING</h3>
                <canvas id="ageChart"></canvas>
            </div>
            <div class="chart-box">
                <h3 style="color: var(--primary); font-size: 12px;">EFFICIENCY RANKING</h3>
                <div id="healthRankList"></div>
            </div>
        </div>
    </div>

    <div id="approvals" class="tab-content">
        <div class="table-container">
            <input type="text" class="search-bar" id="tableSearch" placeholder="SEARCH REGISTRY (e.g. Vendor name, PRF#, Entity...)" onkeyup="filterApprovalsTable()">
            <div style="max-height: 700px; overflow-y: auto;">
                <table class="data-table" id="approvalsTable">
                    <thead>
                        <tr id="tableHeaders"></tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

<script>
    let appData = [], recData = [], pnlData = [];
    let mixChart, ageChart;

    const SHEET_ID = "164nSeGrs3Wx_dLdUeoSVanRWzRpcuQic1sCwcgtGmAo";

    function switchTab(tabId, el) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        el.classList.add('active');
    }

    async function fetchData() {
        try {
            [appData, recData, pnlData] = await Promise.all([
                fetchSheet("Approvals"),
                fetchSheet("Reconciliation Report"),
                fetchSheet("P&L Costs Summary")
            ]);
            document.getElementById('status').innerText = "SYSTEM ONLINE • " + new Date().toLocaleTimeString();
            initFilters();
            updateDashboard();
            renderApprovalsTable();
        } catch (e) {
            document.getElementById('status').innerText = "LINK SEVERED";
        }
    }

    function fetchSheet(sheetName) {
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}&t=${Date.now()}`;
        return fetch(url).then(res => res.text()).then(text => {
            const json = JSON.parse(text.substring(47).slice(0, -2));
            const cols = json.table.cols.map(c => c.label);
            return json.table.rows.map(r => {
                let obj = {};
                r.c.forEach((cell, i) => { obj[cols[i]] = cell ? cell.v : ""; });
                return obj;
            });
        });
    }

    function renderApprovalsTable() {
        if (!appData.length) return;
        const head = document.getElementById('tableHeaders');
        const body = document.getElementById('tableBody');
        
        // Get columns from first row
        const cols = Object.keys(appData[0]);
        head.innerHTML = cols.map(c => `<th>${c}</th>`).join('') + `<th>Action</th>`;

        body.innerHTML = appData.map(row => {
            const cells = cols.map(c => `<td>${row[c] || '-'}</td>`).join('');
            // Logic to find a PDF link in any column that contains "http" or specifically labeled "Link/PDF"
            const linkKey = cols.find(k => k.toLowerCase().includes('link') || k.toLowerCase().includes('pdf') || String(row[k]).includes('http'));
            const actionBtn = linkKey ? `<td><a href="${row[linkKey]}" target="_blank" class="pdf-btn">View PDF</a></td>` : `<td>-</td>`;
            return `<tr>${cells}${actionBtn}</tr>`;
        }).join('');
    }

    function filterApprovalsTable() {
        const query = document.getElementById('tableSearch').value.toLowerCase();
        const rows = document.querySelectorAll('#tableBody tr');
        rows.forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(query) ? '' : 'none';
        });
    }

    // --- Original Dashboard Logic ---
    const clean = (v) => v ? parseFloat(v.toString().replace(/[^\d.-]/g, '')) || 0 : 0;
    const getCol = (row, ...keys) => {
        const found = Object.keys(row).find(k => keys.some(s => k.toLowerCase().trim() === s.toLowerCase().trim()));
        return found ? row[found] : null;
    };

    function initFilters() {
        const fill = (id, data, keys) => {
            const el = document.getElementById(id);
            if (el.children.length > 0) return;
            const vals = [...new Set(data.map(r => getCol(r, ...keys)).filter(v => v))].sort();
            vals.forEach(v => {
                const item = document.createElement('div');
                item.className = 'dropdown-item';
                item.innerHTML = `<input type="checkbox" value="${v}" onchange="updateDashboard()"> ${v}`;
                el.appendChild(item);
            });
        };
        fill('fCompList', appData, ['Burn Company', 'Company']);
        fill('fYearList', appData, ['Year']);
    }

    function updateDashboard() {
        let prf = 0, actual = 0, pnl = 0;
        appData.forEach(r => {
            const amt = clean(getCol(r, 'Amount (USD)'));
            const type = (getCol(r, 'Document Type', 'Type') || "").toUpperCase();
            if (type.includes('PRF')) prf += amt;
            else actual += amt;
        });
        pnlData.forEach(r => pnl += clean(getCol(r, 'Amount (USD)')));

        const fmt = (v) => v.toLocaleString('en-US', {style:'currency', currency:'USD', maximumFractionDigits:0});
        document.getElementById('valPRF').innerText = fmt(prf);
        document.getElementById('valActual').innerText = fmt(actual);
        document.getElementById('valPNL').innerText = fmt(pnl);
    }

    function toggleDropdown(id) {
        document.getElementById(id).classList.toggle('show');
    }

    window.onload = () => {
        mixChart = new Chart(document.getElementById('mixChart'), { 
            type: 'doughnut', 
            data: { labels: ['Rec', 'Pen'], datasets: [{ backgroundColor: ['#00ff9d', '#ff4d4d'], data: [65, 35], borderWidth: 0 }] },
            options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#fff' } } } }
        });
        ageChart = new Chart(document.getElementById('ageChart'), { 
            type: 'pie', 
            data: { labels: ['1-7d', '8-14d', '15d+'], datasets: [{ backgroundColor: ['#ff9f43', '#f1c40f', '#475569'], data: [10, 20, 30], borderWidth: 0 }] },
            options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#fff' } } } }
        });
        fetchData();
        setInterval(fetchData, 60000);
    };
</script>
</body>
</html>
