<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ELECTRIC SMT Command Center</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        :root { 
            --primary: #00d2ff; 
            --accent: #1e293b;
            --green: #00ff9d; 
            --red: #ff4d4d; 
            --orange: #ff9f43; 
            --bg: #0f172a; 
            --card: #1e293b; 
            --dark-blue: #0f172a; 
            --text-main: #ffffff;
            --text-light: #cbd5e1;
            --border: #475569;
        }
        
        * { box-sizing: border-box; }
        body { font-family: 'Inter', 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 12px; color: var(--text-main); font-size: 12px; line-height: 1.4; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 2px solid var(--primary); padding-bottom: 8px; }
        .header h3 { font-weight: 800; letter-spacing: 1px; color: var(--primary); text-transform: uppercase; margin: 0; }
        
        .tab-container { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab-btn { background: var(--card); border: 1px solid var(--border); color: var(--text-light); padding: 8px 20px; cursor: pointer; font-weight: 800; text-transform: uppercase; border-radius: 5px 5px 0 0; }
        .tab-btn.active { background: var(--primary); color: var(--bg); border-color: var(--primary); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Global Filters - Hidden on Ledger Tab */
        #global-filter-bar { display: flex; flex-wrap: wrap; gap: 10px; background: var(--card); padding: 12px; border-radius: 8px; margin-bottom: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.4); border: 1px solid var(--border); align-items: flex-end; }
        .f-group { display: flex; flex-direction: column; min-width: 140px; flex: 1; position: relative; }
        .f-group label { font-size: 10px; font-weight: 800; color: var(--text-light); text-transform: uppercase; margin-bottom: 4px; letter-spacing: 0.5px; }
        
        .multiselect-container { background: #0f172a; color: white; border: 1px solid var(--primary); border-radius: 5px; font-size: 11px; height: 32px; cursor: pointer; display: flex; align-items: center; padding: 0 10px; font-weight: 600; overflow: hidden; white-space: nowrap; }
        .dropdown-content { display: none; position: absolute; top: 50px; left: 0; background: #1e293b; border: 1px solid var(--primary); width: 100%; z-index: 100; max-height: 250px; overflow-y: auto; border-radius: 5px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); }
        .dropdown-content.show { display: block; }
        .dropdown-item { padding: 8px 10px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #334155; }
        .dropdown-item:hover { background: #334155; }
        .dropdown-item input { height: auto; width: auto; cursor: pointer; }

        select, input { background: #0f172a; color: white; padding: 4px 10px; border: 1px solid var(--primary); border-radius: 5px; font-size: 11px; height: 32px; outline: none; font-weight: 600; }

        .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 12px; }
        .tile { background: var(--card); padding: 15px; border-radius: 8px; text-align: center; border: 1px solid var(--border); }
        .tile-label { font-size: 11px; color: var(--text-light); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .tile-val { font-size: 1.8rem; font-weight: 900; color: #ffffff; margin: 4px 0; }
        .breakdown { display: flex; justify-content: space-around; font-size: 11px; border-top: 1px solid var(--border); padding-top: 8px; margin-top: 8px; color: var(--text-main); font-weight: 600; }
        .breakdown b { color: var(--primary); font-weight: 900; font-size: 13px; }

        .viz-grid { display: grid; grid-template-columns: 1fr 1fr 1.5fr; gap: 12px; height: 380px; margin-bottom: 12px; }
        .chart-box { background: var(--card); padding: 16px; border-radius: 8px; display: flex; flex-direction: column; border: 1px solid var(--border); position: relative; }
        h3.chart-title { margin: 0 0 15px 0; font-size: 12px; color: var(--primary); text-transform: uppercase; text-align: center; font-weight: 900; letter-spacing: 1.5px; }

        .exec-summary-box { background: var(--card); color: white; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); margin-top: 12px; }
        .exec-header { background: #334155; padding: 10px; text-align: center; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; font-size: 13px; color: var(--primary); border-bottom: 2px solid var(--primary); display: flex; justify-content: center; align-items: center; gap: 20px; }
        .exec-table { width: 100%; border-collapse: collapse; font-size: 11px; }
        .ledger-table { font-size: 14px !important; }
        .ledger-table th { position: relative; padding-right: 25px !important; background: #0f172a; color: var(--primary); padding: 12px; text-align: left; text-transform: uppercase; font-size: 10px; font-weight: 900; border-bottom: 2px solid var(--border); }
        .ledger-table td { padding: 12px 10px !important; border-bottom: 1px solid var(--border); font-weight: 700; }
        
        .header-filter-icon { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--primary); font-size: 10px; }
        .table-wrap { max-height: 75vh; overflow-y: auto; background: var(--card); }

        /* Column Dropdown UI Fixed */
        .col-dropdown-container { position: absolute; top: 100%; left: 0; background: #1e293b; border: 1px solid var(--primary); width: 220px; z-index: 200; display: none; max-height: 350px; overflow-y: auto; border-radius: 5px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); text-transform: none; }
        .col-dropdown-container.show { display: block; }
        .col-filter-header { padding: 8px; border-bottom: 1px solid var(--border); background: #0f172a; position: sticky; top: 0; z-index: 10; }
        .col-filter-search { width: 100%; margin-bottom: 5px; height: 28px; background: #1e293b; border: 1px solid var(--primary); color: white; padding: 0 5px; }
        
        .pdf-btn { background: var(--primary); color: #000; padding: 4px 8px; text-decoration: none; border-radius: 4px; font-size: 9px; font-weight: 900; }
        #status { font-size: 11px; font-weight: 900; color: var(--green); letter-spacing: 1px; }
        button { background: var(--primary); color: #0f172a; border: none; padding: 0 20px; border-radius: 5px; font-weight: 900; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="header">
        <h3>ELECTRIC SMT COMMAND CENTER • ANALYTICS</h3>
        <div id="status">ESTABLISHING LINK...</div>
    </div>

    <div class="tab-container">
        <div class="tab-btn active" onclick="switchTab('cost-analysis', this)">Cost Analysis Dashboard</div>
        <div class="tab-btn" onclick="switchTab('dashboard', this)">Compliance Dashboard</div>
        <div class="tab-btn" onclick="switchTab('approvals-tab', this)">RAW DATA-APPROVALS LEDGER</div>
    </div>

    <div id="global-filter-bar">
        <div class="f-group"><label>Date From</label><input type="date" id="dStart" onchange="updateDashboard()"></div>
        <div class="f-group"><label>Date To</label><input type="date" id="dEnd" onchange="updateDashboard()"></div>
        <div class="f-group"><label>Fiscal Year</label><div class="multiselect-container" onclick="toggleDropdown('fYearList')">Select Years...</div><div id="fYearList" class="dropdown-content"></div></div>
        <div class="f-group"><label>Period</label><div class="multiselect-container" onclick="toggleDropdown('fMonthList')">Select Months...</div><div id="fMonthList" class="dropdown-content"></div></div>
        <div class="f-group"><label>Entity</label><div class="multiselect-container" onclick="toggleDropdown('fCompList')">Select Entities...</div><div id="fCompList" class="dropdown-content"></div></div>
        <div class="f-group"><label>Cost Center</label><div class="multiselect-container" onclick="toggleDropdown('fCCList')">Select Cost Centers...</div><div id="fCCList" class="dropdown-content"></div></div>
        <button onclick="resetFilters()" style="height:32px;">RESET FILTERS</button>
    </div>

    <div id="cost-analysis" class="tab-content active"></div>
    <div id="dashboard" class="tab-content">Dashboard Content Placeholder</div>

    <div id="approvals-tab" class="tab-content">
        <div class="exec-summary-box">
            <div class="exec-header">
                <span>DETAILED APPROVALS LEDGER</span>
                <button onclick="resetFilters()" style="height:25px; font-size:10px; padding:0 10px;">RESET ALL FILTERS</button>
            </div>
            <div class="table-wrap">
                <table class="exec-table ledger-table" id="approvalsTable">
                    <thead id="approvalsHead"></thead>
                    <tbody id="approvalsBody"></tbody>
                </table>
            </div>
        </div>
    </div>

<script>
    let appData = [], recData = [], pnlData = [];
    let tableFilters = {}; 

    const cleanNum = (v) => (v === null || v === undefined || v === "") ? 0 : (typeof v === 'number' ? v : parseFloat(v.toString().replace(/[^\d.-]/g, '')) || 0);
    const getCol = (row, ...keys) => {
        const found = Object.keys(row).find(k => keys.some(s => k.toLowerCase().trim() === s.toLowerCase().trim()));
        return found ? row[found] : null;
    };

    const parseExcelDate = (str) => {
        if (!str) return null;
        let s = str.toString();
        if (s.includes('Date(')) {
            let p = s.match(/\d+/g);
            return p ? new Date(p[0], p[1], p[2]) : null;
        }
        return new Date(s);
    };

    function switchTab(id, btn) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
        document.getElementById('global-filter-bar').style.display = (id === 'approvals-tab') ? 'none' : 'flex';
    }

    function toggleDropdown(id) {
        const el = document.getElementById(id);
        const wasOpen = el.classList.contains('show');
        document.querySelectorAll('.dropdown-content, .col-dropdown-container').forEach(d => d.classList.remove('show'));
        if (!wasOpen) el.classList.add('show');
    }

    window.onclick = (e) => {
        if (!e.target.closest('.multiselect-container') && !e.target.closest('.dropdown-content') && !e.target.closest('.col-dropdown-container') && !e.target.closest('.header-filter-icon')) {
            document.querySelectorAll('.dropdown-content, .col-dropdown-container').forEach(d => d.classList.remove('show'));
        }
    }

    const SHEET_ID = "164nSeGrs3Wx_dLdUeoSVanRWzRpcuQic1sCwcgtGmAo";
    async function fetchSheet(sheetName) {
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}&t=${Date.now()}`;
        const res = await fetch(url);
        const text = await res.text();
        const json = JSON.parse(text.substring(47).slice(0, -2));
        const cols = json.table.cols.map(c => c.label || `Col${json.table.cols.indexOf(c)}`);
        return json.table.rows.map(r => {
            let obj = {};
            r.c.forEach((cell, i) => { obj[cols[i]] = cell ? (cell.v !== null ? cell.v : "") : ""; });
            return obj;
        });
    }

    async function fetchData() {
        try {
            [appData, recData, pnlData] = await Promise.all([fetchSheet("Approvals"), fetchSheet("Reconciliation Report"), fetchSheet("P&L Costs Summary")]);
            document.getElementById('status').innerText = "SYSTEM ONLINE • " + new Date().toLocaleTimeString();
            initGlobalFilters();
            updateDashboard();
        } catch (e) {
            document.getElementById('status').innerText = "LINK RE-ESTABLISHING...";
            setTimeout(fetchData, 5000);
        }
    }

    function initGlobalFilters() {
        const fill = (id, keys) => {
            const el = document.getElementById(id);
            if (el.children.length > 0) return;
            const vals = [...new Set(appData.map(r => getCol(r, ...keys)).filter(v => v))].sort();
            el.innerHTML = `<div class="dropdown-item"><input type="checkbox" onchange="toggleAll('${id}', this.checked)"> <b>SELECT ALL</b></div>`;
            vals.forEach(v => {
                el.innerHTML += `<div class="dropdown-item"><input type="checkbox" value="${v}" onchange="updateDashboard()"> ${v}</div>`;
            });
        };
        fill('fCompList', ['Burn Company', 'Company']);
        fill('fCCList', ['Cost Center', 'Cost Centre']);
        fill('fMonthList', ['Month']);
        fill('fYearList', ['Year']);
    }

    function toggleAll(id, chk) {
        document.querySelectorAll(`#${id} input`).forEach(i => i.checked = chk);
        updateDashboard();
    }

    function resetFilters() {
        document.getElementById('dStart').value = '';
        document.getElementById('dEnd').value = '';
        document.querySelectorAll('input[type="checkbox"]').forEach(i => i.checked = false);
        tableFilters = {};
        updateDashboard();
    }

    function updateDashboard() {
        const gF = {
            start: document.getElementById('dStart').value ? new Date(document.getElementById('dStart').value) : null,
            end: document.getElementById('dEnd').value ? new Date(document.getElementById('dEnd').value) : null,
            yr: getSelected('fYearList'), mo: getSelected('fMonthList'),
            comp: getSelected('fCompList'), cc: getSelected('fCCList')
        };

        const filtered = appData.filter(row => {
            const d = parseExcelDate(getCol(row, 'Date Approved', 'Approval Date'));
            if (gF.start && d < gF.start) return false;
            if (gF.end && d > gF.end) return false;
            if (gF.yr && !gF.yr.includes(String(getCol(row, 'Year')))) return false;
            if (gF.mo && !gF.mo.includes(getCol(row, 'Month'))) return false;
            if (gF.comp && !gF.comp.includes(getCol(row, 'Burn Company', 'Company'))) return false;
            if (gF.cc && !gF.cc.includes(getCol(row, 'Cost Center', 'Cost Centre'))) return false;
            
            for(let col in tableFilters) {
                if(tableFilters[col].length > 0 && !tableFilters[col].includes(String(row[col] || "-"))) return false;
            }
            return true;
        });
        renderTable(filtered);
    }

    function getSelected(id) {
        const c = Array.from(document.querySelectorAll(`#${id} input:checked`)).map(i => i.value).filter(v => v);
        return c.length > 0 ? c : null;
    }

    function renderTable(data) {
        const head = document.getElementById('approvalsHead');
        const body = document.getElementById('approvalsBody');
        const excludes = ['link', 'pdf link', 'url', 'last modified date', 'full file name'];
        const cols = Object.keys(appData[0] || {}).filter(c => !excludes.includes(c.toLowerCase().trim()));

        if (head.children.length === 0 && cols.length > 0) {
            let trH = '<tr>';
            cols.forEach(c => {
                const dropId = `drop_${c.replace(/\W/g, '')}`;
                trH += `<th>${c} <span class="header-filter-icon" onclick="toggleDropdown('${dropId}')">▼</span>
                    <div id="${dropId}" class="col-dropdown-container">
                        <div class="col-filter-header">
                            <input type="text" class="col-filter-search" placeholder="Search..." onkeyup="searchList('${dropId}', this.value)">
                            <div class="dropdown-item"><input type="checkbox" onchange="toggleTableCol('${c}', '${dropId}', this.checked)"> <b>SELECT ALL</b></div>
                        </div>
                        <div class="col-list"></div>
                    </div></th>`;
            });
            trH += '<th>Action</th></tr>';
            head.innerHTML = trH;
            
            cols.forEach(c => {
                const dropId = `drop_${c.replace(/\W/g, '')}`;
                const list = document.querySelector(`#${dropId} .col-list`);
                const uniqueVals = [...new Set(appData.map(r => String(r[c] || "-")))].sort();
                uniqueVals.forEach(v => {
                    const item = document.createElement('div');
                    item.className = 'dropdown-item';
                    item.innerHTML = `<input type="checkbox" value="${v}" onchange="updateTableFilter('${c}', '${dropId}')"> ${v}`;
                    list.appendChild(item);
                });
            });
        }

        body.innerHTML = '';
        data.forEach(row => {
            let tr = '<tr>';
            cols.forEach(c => {
                let v = row[c] || '-';
                if (c.toLowerCase().includes('amount')) v = cleanNum(v).toLocaleString();
                if (c.toLowerCase().includes('date')) {
                    let d = parseExcelDate(v);
                    v = (d && !isNaN(d)) ? d.toLocaleDateString('en-GB') : v;
                }
                tr += `<td>${v}</td>`;
            });
            const pdf = getCol(row, 'PDF Link', 'Link', 'URL');
            tr += `<td>${pdf ? `<a href="${pdf}" target="_blank" class="pdf-btn">VIEW</a>` : '-'}</td></tr>`;
            body.innerHTML += tr;
        });
    }

    function searchList(id, q) {
        const items = document.querySelectorAll(`#${id} .col-list .dropdown-item`);
        items.forEach(i => i.style.display = i.innerText.toLowerCase().includes(q.toLowerCase()) ? 'flex' : 'none');
    }

    function toggleTableCol(col, id, chk) {
        document.querySelectorAll(`#${id} .col-list input`).forEach(i => i.checked = chk);
        updateTableFilter(col, id);
    }

    function updateTableFilter(col, id) {
        tableFilters[col] = Array.from(document.querySelectorAll(`#${id} .col-list input:checked`)).map(i => i.value);
        updateDashboard();
    }

    window.onload = fetchData;
</script>
</body>
</html>
