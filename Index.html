<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>ELECTRIC SMT Command Center</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #00d2ff; --accent: #1e293b; --green: #00ff9d; --red: #ff4d4d; --orange: #ff9f43; --bg: #0f172a; --card: #1e293b; --text-main: #fff; --text-light: #cbd5e1; --border: #475569; }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 12px; color: var(--text-main); font-size: 12px; }
        .header { display: flex; justify-content: space-between; border-bottom: 2px solid var(--primary); padding-bottom: 8px; margin-bottom: 12px; }
        .tab-btn { background: var(--card); border: 1px solid var(--border); color: var(--text-light); padding: 8px 20px; cursor: pointer; font-weight: 800; border-radius: 5px 5px 0 0; }
        .tab-btn.active { background: var(--primary); color: var(--bg); }
        .tab-content { display: none; } .tab-content.active { display: block; }
        .filter-section { display: flex; flex-wrap: wrap; gap: 10px; background: var(--card); padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid var(--border); }
        .f-group { display: flex; flex-direction: column; flex: 1; position: relative; }
        .multiselect-container { background: #0f172a; border: 1px solid var(--primary); border-radius: 5px; height: 32px; display: flex; align-items: center; padding: 0 10px; font-weight: 600; cursor: pointer; }
        .dropdown-content { display: none; position: absolute; top: 50px; background: #1e293b; border: 1px solid var(--primary); width: 100%; z-index: 100; max-height: 250px; overflow-y: auto; }
        .dropdown-content.show { display: block; }
        select, input { background: #0f172a; color: white; border: 1px solid var(--primary); border-radius: 5px; height: 32px; padding: 0 10px; }
        .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 12px; }
        .tile { background: var(--card); padding: 15px; border-radius: 8px; text-align: center; border: 1px solid var(--border); }
        .tile-val { font-size: 1.8rem; font-weight: 900; margin: 4px 0; }
        .viz-grid { display: grid; grid-template-columns: 1fr 1fr 1.5fr; gap: 12px; height: 380px; margin-bottom: 12px; }
        .chart-box { background: var(--card); padding: 16px; border-radius: 8px; border: 1px solid var(--border); }
        .exec-summary-box { background: var(--card); border-radius: 8px; border: 1px solid var(--border); margin-top: 12px; overflow: hidden; }
        .exec-header { background: #334155; padding: 10px; text-align: center; font-weight: 900; color: var(--primary); border-bottom: 2px solid var(--primary); }
        .exec-table { width: 100%; border-collapse: collapse; }
        .exec-table th { background: #0f172a; color: var(--primary); padding: 12px; text-align: left; font-size: 10px; border-bottom: 2px solid var(--border); }
        .exec-table td { padding: 10px; border-bottom: 1px solid var(--border); font-weight: 700; }
        .table-wrap { max-height: 850px; overflow-y: auto; }
        .status-cell { font-weight: 900; text-align: center; }
        .bg-bad { background: #7f1d1d; color: #fecaca; } .bg-good { background: #064e3b; color: #d1fae5; }
        .pdf-btn { background: var(--primary); color: #000; padding: 4px 8px; border-radius: 4px; font-size: 9px; font-weight: 900; text-decoration: none; }
    </style>
</head>
<body>
    <div class="header"><h3>ELECTRIC SMT COMMAND CENTER</h3><div id="status">ESTABLISHING LINK...</div></div>
    <div class="tab-container"><button class="tab-btn active" onclick="switchTab('dashboard', this)">Analytics</button><button class="tab-btn" onclick="switchTab('approvals-tab', this)">Ledger</button></div>
    <div class="filter-section">
        <div class="f-group"><label>Start</label><input type="date" id="dStart" onchange="updateDashboard()"></div>
        <div class="f-group"><label>End</label><input type="date" id="dEnd" onchange="updateDashboard()"></div>
        <div class="f-group"><label>Entity</label><div class="multiselect-container" onclick="toggleDropdown('fCompList')">Select...</div><div id="fCompList" class="dropdown-content"></div></div>
        <button onclick="location.reload()">RESET</button>
    </div>
    <div id="dashboard" class="tab-content active">
        <div class="kpi-grid">
            <div class="tile"><span>PRF Spend</span><div class="tile-val" id="valPRF">$0</div></div>
            <div class="tile"><span>Actual Spend</span><div class="tile-val" id="valActual">$0</div></div>
            <div class="tile"><span>P&L Impact</span><div class="tile-val" id="valPNL">$0</div></div>
        </div>
        <div class="viz-grid">
            <div class="chart-box"><canvas id="mixChart"></canvas></div>
            <div class="chart-box"><canvas id="ageChart"></canvas></div>
            <div id="healthRankList" class="chart-box"></div>
        </div>
        <div class="exec-summary-box">
            <div class="exec-header">STRATEGIC KPI MATRIX</div>
            <table class="exec-table"><thead><tr><th>Category</th><th>Target</th><th>Value</th><th>Status</th></tr></thead>
            <tbody><tr><td>Compliance</td><td>50% PRFs</td><td id="exCompVal" class="status-cell">0%</td><td id="exCompTrend">-</td></tr></tbody></table>
        </div>
    </div>
    <div id="approvals-tab" class="tab-content">
        <div class="exec-summary-box"><div class="exec-header">DETAILED LEDGER</div><div class="table-wrap"><table class="exec-table"><thead id="approvalsHead"></thead><tbody id="approvalsBody"></tbody></table></div></div>
    </div>
    <script>
        let appData = [], recData = [], pnlData = [], mixChart, ageChart;
        const SHEET_ID = "164nSeGrs3Wx_dLdUeoSVanRWzRpcuQic1sCwcgtGmAo";
        const clean = v => parseFloat(v?.toString().replace(/[^\d.-]/g, '')) || 0;
        const getCol = (row, ...keys) => row[Object.keys(row).find(k => keys.includes(k))];

        async function fetchData() {
            const fetchSheet = n => fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${n}`).then(r => r.text()).then(t => {
                const j = JSON.parse(t.substring(47).slice(0,-2));
                const c = j.table.cols.map(x => x.label);
                return j.table.rows.map(r => r.c.reduce((o,v,i) => ({...o, [c[i]]: v?.v}), {}));
            });
            [appData, recData, pnlData] = await Promise.all([fetchSheet("Approvals"), fetchSheet("Reconciliation Report"), fetchSheet("P&L Costs Summary")]);
            document.getElementById('status').innerText = "ONLINE";
            updateDashboard();
        }

        function switchTab(id, btn) {
            document.querySelectorAll('.tab-content, .tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active'); btn.classList.add('active');
        }

        function toggleDropdown(id) { document.getElementById(id).classList.toggle('show'); }

        function updateDashboard() {
            let prf = 0, actual = 0;
            appData.forEach(r => {
                const amt = clean(r['Amount (USD)']);
                if (r['Document Type']?.includes('PRF')) prf += amt; else actual += amt;
            });
            document.getElementById('valPRF').innerText = '$' + prf.toLocaleString();
            document.getElementById('valActual').innerText = '$' + actual.toLocaleString();
            renderTable(appData);
        }

        function renderTable(data) {
            const head = document.getElementById('approvalsHead'), body = document.getElementById('approvalsBody');
            head.innerHTML = '<tr><th>File Name</th><th>Date</th><th>Amount (USD)</th><th>Action</th></tr>';
            body.innerHTML = data.map(r => `<tr><td>${r['Full File Name']}</td><td>${r['Date Approved']}</td><td>${r['Amount (USD)']}</td><td><a href="${r['PDF Link']}" class="pdf-btn">VIEW</a></td></tr>`).join('');
        }

        window.onload = () => {
            mixChart = new Chart(document.getElementById('mixChart'), { type: 'doughnut', data: { datasets: [{data: [10, 90], backgroundColor: ['#00ff9d', '#ff4d4d']}] }});
            ageChart = new Chart(document.getElementById('ageChart'), { type: 'pie', data: { datasets: [{data: [30, 40, 30], backgroundColor: ['#ff9f43', '#f1c40f', '#475569']}] }});
            fetchData();
        };
    </script>
</body>
</html>
