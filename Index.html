<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ELECTRIC SMT Command Center</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        :root { 
            --primary: #00d2ff; 
            --accent: #1e293b;
            --green: #00ff9d; 
            --red: #ff4d4d; 
            --orange: #ff9f43; 
            --bg: #0f172a; 
            --card: #1e293b; 
            --text-main: #ffffff;
            --text-light: #cbd5e1;
            --border: #475569;
        }
        
        * { box-sizing: border-box; }
        body { font-family: 'Inter', 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 12px; color: var(--text-main); font-size: 12px; line-height: 1.4; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 2px solid var(--primary); padding-bottom: 8px; }
        .header h3 { font-weight: 800; letter-spacing: 1px; color: var(--primary); text-transform: uppercase; margin: 0; }
        
        .tab-container { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab-btn { background: var(--card); border: 1px solid var(--border); color: var(--text-light); padding: 8px 20px; cursor: pointer; font-weight: 800; text-transform: uppercase; border-radius: 5px 5px 0 0; }
        .tab-btn.active { background: var(--primary); color: var(--bg); border-color: var(--primary); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .filter-section { display: flex; flex-wrap: wrap; gap: 10px; background: var(--card); padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid var(--border); align-items: flex-end; }
        .f-group { display: flex; flex-direction: column; min-width: 140px; flex: 1; position: relative; }
        .f-group label { font-size: 10px; font-weight: 800; color: var(--text-light); text-transform: uppercase; margin-bottom: 4px; }
        
        .multiselect-container { background: #0f172a; color: white; border: 1px solid var(--primary); border-radius: 5px; font-size: 11px; height: 32px; cursor: pointer; display: flex; align-items: center; padding: 0 10px; font-weight: 600; }
        .dropdown-content { display: none; position: absolute; top: 50px; left: 0; background: #1e293b; border: 1px solid var(--primary); width: 100%; z-index: 100; max-height: 250px; overflow-y: auto; border-radius: 5px; }
        .dropdown-content.show { display: block; }
        .dropdown-item { padding: 8px 10px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #334155; }
        .dropdown-item:hover { background: #334155; }
        
        input, button { background: #0f172a; color: white; border: 1px solid var(--primary); border-radius: 5px; font-size: 11px; height: 32px; padding: 0 10px; font-weight: 600; }
        button { background: var(--primary); color: #0f172a; border: none; cursor: pointer; text-transform: uppercase; font-weight: 900; }

        .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 12px; }
        .tile { background: var(--card); padding: 15px; border-radius: 8px; text-align: center; border: 1px solid var(--border); }
        .tile-val { font-size: 1.8rem; font-weight: 900; }

        /* Ledger Table Styles */
        .table-controls { display: flex; justify-content: flex-end; margin-bottom: 10px; }
        .table-wrap { max-height: 80vh; overflow: auto; background: var(--card); border-radius: 8px; border: 1px solid var(--border); }
        .exec-table { width: 100%; border-collapse: collapse; font-size: 11px; color: white; }
        .exec-table th { background: #0f172a; color: var(--primary); padding: 12px; text-align: left; position: sticky; top: 0; z-index: 10; border-bottom: 2px solid var(--border); }
        .exec-table td { padding: 10px; border-bottom: 1px solid var(--border); }

        .header-filter-icon { margin-left: 5px; cursor: pointer; color: var(--primary); font-size: 10px; }
        
        .col-dropdown-container {
            position: absolute;
            top: 100%;
            left: 0;
            background: #1e293b;
            border: 1px solid var(--primary);
            width: 220px;
            z-index: 200;
            display: none;
            max-height: 350px;
            overflow-y: auto;
            border-radius: 5px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.5);
            text-transform: none;
        }
        .col-dropdown-container.show { display: block; }
        .col-filter-header { padding: 8px; background: #0f172a; position: sticky; top: 0; z-index: 11; border-bottom: 1px solid var(--border); }
        .col-filter-search { width: 100%; height: 25px; margin-bottom: 5px; }
        
        .pdf-btn { background: var(--primary); color: #000; padding: 4px 8px; text-decoration: none; border-radius: 4px; font-weight: 900; font-size: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <h3>ELECTRIC SMT COMMAND CENTER • ANALYTICS</h3>
        <div id="status">ESTABLISHING LINK...</div>
    </div>

    <div class="tab-container">
        <div class="tab-btn active" onclick="switchTab('cost-analysis', this)">Cost Analysis Dashboard</div>
        <div class="tab-btn" onclick="switchTab('dashboard', this)">Compliance Dashboard</div>
        <div class="tab-btn" onclick="switchTab('approvals-tab', this)">RAW DATA-APPROVALS LEDGER</div>
    </div>

    <div id="global-filter-bar" class="filter-section">
        <div class="f-group"><label>Date From</label><input type="date" id="dStart" onchange="updateDashboard()"></div>
        <div class="f-group"><label>Date To</label><input type="date" id="dEnd" onchange="updateDashboard()"></div>
        <div class="f-group"><label>Fiscal Year</label><div class="multiselect-container" onclick="toggleDropdown('fYearList')">Select Years...</div><div id="fYearList" class="dropdown-content"></div></div>
        <div class="f-group"><label>Period</label><div class="multiselect-container" onclick="toggleDropdown('fMonthList')">Select Months...</div><div id="fMonthList" class="dropdown-content"></div></div>
        <div class="f-group"><label>Entity</label><div class="multiselect-container" onclick="toggleDropdown('fCompList')">Select Entities...</div><div id="fCompList" class="dropdown-content"></div></div>
        <div class="f-group"><label>Cost Center</label><div class="multiselect-container" onclick="toggleDropdown('fCCList')">Select Cost Centers...</div><div id="fCCList" class="dropdown-content"></div></div>
        <button onclick="resetFilters()">RESET FILTERS</button>
    </div>

    <div id="cost-analysis" class="tab-content active"></div>
    <div id="dashboard" class="tab-content">
        </div>

    <div id="approvals-tab" class="tab-content">
        <div class="table-controls">
            <button onclick="resetFilters()" style="background: var(--red); color: white;">RESET ALL TABLE FILTERS</button>
        </div>
        <div class="table-wrap">
            <table class="exec-table" id="approvalsTable">
                <thead id="approvalsHead"></thead>
                <tbody id="approvalsBody"></tbody>
            </table>
        </div>
    </div>

<script>
    let appData = [], recData = [], pnlData = [];
    let tableFilters = {}; 

    const cleanNum = (v) => {
        if (!v) return 0;
        return typeof v === 'number' ? v : parseFloat(v.toString().replace(/[^\d.-]/g, '')) || 0;
    };

    const getCol = (row, ...keys) => {
        const found = Object.keys(row).find(k => keys.some(s => k.toLowerCase().trim() === s.toLowerCase().trim()));
        return found ? row[found] : null;
    };

    function switchTab(id, btn) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');

        // Hide global filters if on Ledger tab to save space
        const filterBar = document.getElementById('global-filter-bar');
        filterBar.style.display = (id === 'approvals-tab') ? 'none' : 'flex';
    }

    function toggleDropdown(id) {
        const el = document.getElementById(id);
        const isShow = el.classList.contains('show');
        document.querySelectorAll('.dropdown-content, .col-dropdown-container').forEach(d => d.classList.remove('show'));
        if (!isShow) el.classList.add('show');
    }

    const SHEET_ID = "164nSeGrs3Wx_dLdUeoSVanRWzRpcuQic1sCwcgtGmAo";
    async function fetchSheet(sheetName) {
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}&t=${Date.now()}`;
        const res = await fetch(url);
        const text = await res.text();
        const json = JSON.parse(text.substring(47).slice(0, -2));
        const cols = json.table.cols.map(c => c.label || "");
        return json.table.rows.map(r => {
            let obj = {};
            r.c.forEach((cell, i) => { obj[cols[i]] = cell ? (cell.v !== null ? cell.v : "") : ""; });
            return obj;
        });
    }

    async function fetchData() {
        [appData, recData, pnlData] = await Promise.all([
            fetchSheet("Approvals"),
            fetchSheet("Reconciliation Report"),
            fetchSheet("P&L Costs Summary")
        ]);
        document.getElementById('status').innerText = "SYSTEM ONLINE";
        initGlobalFilters();
        updateDashboard();
    }

    function initGlobalFilters() {
        const fill = (id, keys) => {
            const el = document.getElementById(id);
            if (el.children.length > 1) return;
            const vals = [...new Set(appData.map(r => getCol(r, ...keys)).filter(v => v))].sort();
            el.innerHTML = `<div class="dropdown-item"><input type="checkbox" onchange="toggleAllFilters('${id}', this.checked)"> <b>SELECT ALL</b></div>`;
            vals.forEach(v => {
                el.innerHTML += `<div class="dropdown-item"><input type="checkbox" value="${v}" onchange="updateDashboard()"> ${v}</div>`;
            });
        };
        fill('fCompList', ['Burn Company', 'Company']);
        fill('fCCList', ['Cost Center']);
        fill('fMonthList', ['Month']);
        fill('fYearList', ['Year']);
    }

    function updateDashboard() {
        const filters = {
            yr: Array.from(document.querySelectorAll('#fYearList input:checked')).map(i => i.value),
            comp: Array.from(document.querySelectorAll('#fCompList input:checked')).map(i => i.value)
        };

        const filtered = appData.filter(row => {
            // Apply global filters
            if (filters.yr.length && !filters.yr.includes(String(row['Year']))) return false;
            if (filters.comp.length && !filters.comp.includes(row['Burn Company'])) return false;
            
            // Apply Column filters
            for (let col in tableFilters) {
                if (tableFilters[col].length && !tableFilters[col].includes(String(row[col] || "-"))) return false;
            }
            return true;
        });

        renderLedger(filtered);
    }

    function renderLedger(data) {
        const head = document.getElementById('approvalsHead');
        const body = document.getElementById('approvalsBody');
        const excluded = ['link', 'pdf link', 'url', 'last modified date', 'full file name'];
        const cols = Object.keys(appData[0] || {}).filter(c => !excluded.includes(c.toLowerCase()));

        if (head.innerHTML === "") {
            let hHtml = "<tr>";
            cols.forEach(c => {
                const dropId = `drop_${c.replace(/\s+/g, '_')}`;
                hHtml += `<th>${c} <span class="header-filter-icon" onclick="toggleDropdown('${dropId}')">▼</span>
                    <div id="${dropId}" class="col-dropdown-container">
                        <div class="col-filter-header">
                            <input type="text" class="col-filter-search" placeholder="Search..." onkeyup="searchCol('${dropId}', this.value)">
                            <div class="dropdown-item"><input type="checkbox" onchange="toggleTableCol('${c}', '${dropId}', this.checked)"> <b>SELECT ALL</b></div>
                        </div>
                        <div class="opt-list"></div>
                    </div>
                </th>`;
            });
            hHtml += "<th>Action</th></tr>";
            head.innerHTML = hHtml;

            // Fill Column Options once
            cols.forEach(c => {
                const dropId = `drop_${c.replace(/\s+/g, '_')}`;
                const list = document.querySelector(`#${dropId} .opt-list`);
                const uniqueVals = [...new Set(appData.map(r => String(r[c] || "-")))].sort();
                uniqueVals.forEach(v => {
                    const div = document.createElement('div');
                    div.className = 'dropdown-item';
                    div.innerHTML = `<input type="checkbox" value="${v}" onchange="syncTableFilter('${c}', '${dropId}')"> ${v}`;
                    list.appendChild(div);
                });
            });
        }

        body.innerHTML = data.map(row => `
            <tr>
                ${cols.map(c => `<td>${row[c] || '-'}</td>`).join('')}
                <td><a href="${getCol(row, 'PDF Link', 'Link')}" target="_blank" class="pdf-btn">VIEW</a></td>
            </tr>
        `).join('');
    }

    function searchCol(id, q) {
        const items = document.querySelectorAll(`#${id} .opt-list .dropdown-item`);
        items.forEach(i => i.style.display = i.innerText.toLowerCase().includes(q.toLowerCase()) ? 'flex' : 'none');
    }

    function toggleTableCol(col, dropId, checked) {
        document.querySelectorAll(`#${dropId} .opt-list input`).forEach(i => i.checked = checked);
        syncTableFilter(col, dropId);
    }

    function syncTableFilter(col, dropId) {
        tableFilters[col] = Array.from(document.querySelectorAll(`#${dropId} .opt-list input:checked`)).map(i => i.value);
        updateDashboard();
    }

    function resetFilters() {
        document.querySelectorAll('input[type="checkbox"]').forEach(i => i.checked = false);
        tableFilters = {};
        updateDashboard();
    }

    window.onclick = (e) => {
        if (!e.target.closest('.col-dropdown-container') && !e.target.closest('.header-filter-icon') && !e.target.closest('.multiselect-container')) {
            document.querySelectorAll('.col-dropdown-container, .dropdown-content').forEach(d => d.classList.remove('show'));
        }
    };

    window.onload = fetchData;
</script>
</body>
</html>
